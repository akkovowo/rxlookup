server {
    listen 80;
    listen [::]:80;
    server_name rx.144.124.248.226.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.144.124.248.226.sslip.io;

    root /var/www/rxlookup;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rx.144.124.248.226.sslip.io;

    ssl_certificate /etc/letsencrypt/live/rx.144.124.248.226.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rx.144.124.248.226.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/rxlookup;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
